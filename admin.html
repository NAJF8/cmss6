<script type="module">

    databaseURL: "https://cmms-37512-default-rtdb.asia-southeast1.firebasedatabase.app",

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const googleProvider = new GoogleAuthProvider();

// Expose auth to window
window.auth = auth;
window.signOut = signOut;

// Toast Utility
window.showToast = (msg, type = 'success') => {
    const c = document.getElementById('toast-container');
    const d = document.createElement('div');
    d.className = 'p-3.5 px-4 rounded-xl shadow-lg font-bold text-white text-xs flex items-center justify-between ' + (type === 'success' ? 'bg-success' : (type === 'info' ? 'bg-action' : 'bg-danger'));
    d.textContent = msg;
    c.appendChild(d);
    setTimeout(() => {
        d.style.opacity = '0';
        d.style.transition = 'opacity 0.3s';
        setTimeout(() => d.remove(), 300);
    }, 3000);
};

const elLogin = document.getElementById('login-view');
const elApp = document.getElementById('app-view');
const elContent = document.getElementById('content');

let currentUser = null;
let currentProfile = null;
let currentHash = '#dashboard';
let dbData = { 
    assets: {}, 
    workOrders: {}, 
    breakdowns: {}, 
    users: {}, 
    roles: {}, 
    spareParts: {}, 
    settings: {}, 
    auditLogs: {} 
};

// Modal helpers
window.closeModal = () => document.getElementById('modal-container').classList.add('hide');

window.openModal = (title, bodyHtml, onSave) => {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-container').classList.remove('hide');
    document.getElementById('modal-save').onclick = async () => {
        const btn = document.getElementById('modal-save');
        btn.disabled = true;
        btn.textContent = 'جاري الحفظ...';
        try {
            if (await onSave()) closeModal();
        } catch(e) {
            showToast(e.message || 'حدث خطأ في الحفظ', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'حفظ';
        }
    };
};

window.showQrModal = (code, name) => {
    const modal = document.getElementById('qr-modal');
    document.getElementById('qr-title').textContent = name;
    document.getElementById('qr-subtitle').textContent = code;
    const qrDiv = document.getElementById('qrcode');
    qrDiv.innerHTML = '';
    new QRCode(qrDiv, { text: code, width: 180, height: 180 });
    modal.classList.remove('hide');
};

const logAudit = (action, details) => {
    push(ref(db, 'auditLogs'), {
        user: currentProfile?.email || currentUser?.email || 'System',
        action,
        details,
        date: Date.now()
    }).catch(console.error);
};
window.logAudit = logAudit;

// Permission Check
const hasPerm = (perm) => {
    if (!currentProfile) return true;
    if (currentProfile.isSuperAdmin) return true;
    return true; // Full access for testing
};

// Navigation definition
const getAllNavs = () => [
    { id: 'dashboard', label: 'لوحة التحكم', section: 'الرئيسية' },
    { id: 'assets', label: 'المكائن والأصول', section: 'الصيانة' },
    { id: 'workorders', label: 'أوامر العمل', section: 'الصيانة' },
    { id: 'breakdowns', label: 'الأعطال', section: 'الصيانة' },
    { id: 'inventory', label: 'قطع الغيار', section: 'المخزون' },
    { id: 'employees', label: 'الموظفون', section: 'الإدارة' },
    { id: 'users', label: 'المستخدمون والصلاحيات', section: 'الإدارة' },
    { id: 'audit', label: 'سجل النظام', section: 'النظام' },

const renderSidebar = () => {
    let html = '';
    let curSec = '';
    const navs = getAllNavs();
    
    navs.forEach(n => {
        if (n.section !== curSec) {
            curSec = n.section;
            html += '<div class="px-5 pt-3 pb-1 text-[11px] font-extrabold text-gray-500 uppercase tracking-wider">' + curSec + '</div>';
        }
        const isActive = currentHash === '#' + n.id;
        html += '<a href="#' + n.id + '" class="nav-link block px-5 py-2.5 text-xs font-bold ' + (isActive ? 'active' : '') + '">' + n.label + '</a>';
    });
    document.getElementById('sidebar').innerHTML = html;
};

// Table Helper
const createTable = (headers, rows, addFn, addLabel) => {
    return `
    <div class="mb-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div class="relative w-full sm:w-80">
            <input type="text" placeholder="بحث سريع..." onkeyup="filterCurrentTable(this.value)" class="w-full border border-border rounded-xl pl-3 pr-9 py-2 text-xs outline-none focus:border-action transition bg-white shadow-sm">
            <svg class="w-4 h-4 text-gray-400 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        ${addFn ? `<button onclick="${addFn}" class="bg-action text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-1.5 whitespace-nowrap">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            ${addLabel}
        </button>` : ''}
    </div>
    <div class="bg-surface rounded-2xl border border-border shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-xs text-right" id="data-table">
                <thead class="bg-gray-50 text-secondary border-b border-border font-bold">
                    <tr>${headers.map(h => `<th class="p-3.5 whitespace-nowrap">${h}</th>`).join('')}</tr>
                </thead>
                <tbody class="divide-y divide-border">
                    ${rows.length ? rows.join('') : '<tr><td colspan="' + headers.length + '" class="p-10 text-center text-secondary font-bold">لا توجد بيانات للعرض حالياً</td></tr>'}
                </tbody>
            </table>
        </div>
        <div class="p-3.5 border-t border-border bg-gray-50/50 flex justify-between items-center text-[11px] text-secondary font-bold">
            <div>إجمالي السجلات: ${rows.length}</div>
        </div>
    </div>`;
};

window.filterCurrentTable = (query) => {
    const q = query.toLowerCase();
    const rows = document.querySelectorAll('#data-table tbody tr');
    rows.forEach(r => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
};

// ==========================================
// 1. DASHBOARD
// ==========================================
const renderDashboard = () => {
    const assets = Object.values(dbData.assets || {});
    const wos = Object.values(dbData.workOrders || {});
    const parts = Object.values(dbData.spareParts || {});
    const brks = Object.values(dbData.breakdowns || {});
    
    const totalAssets = assets.length;
    const running = assets.filter(a => a.status === 'active').length;

                <div class="text-2xl font-extrabold text-danger">${stopped}</div>
            </div>
            <div class="bg-surface p-4 rounded-xl border border-border">
                <div class="text-[11px] text-secondary font-bold mb-1">أعطال نشطة</div>
                <div class="text-2xl font-extrabold text-primary">${activeBrks}</div>
            </div>
            <div class="bg-surface p-4 rounded-xl border border-border border-r-4 border-r-red-800">
                <div class="text-[11px] text-secondary font-bold mb-1">أعطال حرجة</div>
                <div class="text-2xl font-extrabold text-red-700">${criticalBrks}</div>
            </div>
            <div class="bg-surface p-4 rounded-xl border border-border">
                <div class="text-[11px] text-secondary font-bold mb-1">أوامر مفتوحة</div>
                <div class="text-2xl font-extrabold text-action">${openWos}</div>
            </div>
            <div class="bg-surface p-4 rounded-xl border border-border border-r-4 border-r-warning">

                <div class="text-2xl font-extrabold text-warning">${lowStock}</div>
            </div>
            <div class="bg-surface p-4 rounded-xl border border-border">
                <div class="text-[11px] text-secondary font-bold mb-1">Availability</div>
                <div class="text-2xl font-extrabold text-primary">${availability}%</div>
            </div>
        </div>

        <!-- Row 2: Production Lines & Critical Alerts -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mb-6">
            <div class="lg:col-span-8 bg-surface rounded-2xl border border-border p-5">
                <div class="font-extrabold text-sm text-primary mb-3 flex items-center justify-between">
                    <span>خطوط الإنتاج (Production Lines)</span>
                    <span class="text-xs text-secondary font-normal">الشركة الوطنية للصناعات الهندسية</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-right">
                        <thead>
                            <tr class="text-secondary border-b border-border pb-2">
                                <th class="pb-2 font-bold">الخط</th>
                                <th class="pb-2 font-bold">المكائن</th>
                                <th class="pb-2 font-bold">تعمل</th>
                                <th class="pb-2 font-bold">متوقفة</th>
                                <th class="pb-2 font-bold">الحالة</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-border">
                            <tr>
                                <td class="py-3 font-bold text-primary">خط التعبئة والتغليف PL-01</td>
                                <td class="py-3">8</td>
                                <td class="py-3 text-success font-bold">7</td>
                                <td class="py-3 text-danger font-bold">1</td>
                                <td class="py-3"><span class="bg-green-50 text-success border border-green-200 px-2 py-0.5 rounded text-[10px] font-bold">مستقر</span></td>

                                <td class="py-3 font-bold text-primary">خط المعالجة والخلط PL-02</td>

// ==========================================
const renderPage = (hash) => {
    currentHash = hash || '#dashboard';
    renderSidebar();
    
    const navItem = getAllNavs().find(n => '#' + n.id === currentHash);
    document.getElementById('page-title').textContent = navItem ? navItem.label : 'لوحة التحكم';

    switch(currentHash) {
        case '#dashboard': renderDashboard(); break;
        case '#assets': renderAssets(); break;
        case '#workorders': renderWorkOrders(); break;
        case '#breakdowns': renderBreakdowns(); break;
        case '#inventory': renderInventory(); break;
        case '#employees': renderEmployees(); break;
        case '#users': renderUsers(); break;
        case '#audit': renderAudit(); break;
        case '#settings': renderSettings(); break;
        default: renderDashboard();
    }
};

window.addEventListener('hashchange', () => {
    if (currentUser) renderPage(window.location.hash);
});

// AUTH & FIREBASE LISTENERS
// ==========================================
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
    } catch (err) {
        document.getElementById('login-error').textContent = 'بيانات الدخول غير صحيحة أو غير مفعلة';
        document.getElementById('login-error').classList.remove('hide');
    }
});

document.getElementById('btn-google').addEventListener('click', async () => {
    try {
        await signInWithPopup(auth, googleProvider);
    } catch (err) {
        console.error(err);
        document.getElementById('login-error').textContent = 'فشل الدخول: ' + (err.message.includes('unauthorized-domain') ? 'يجب إضافة الدومين في Firebase' : err.message);
        document.getElementById('login-error').classList.remove('hide');
    }
});

document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        currentProfile = {
            email: user.email,
            name: user.email === 'mohameadalhaear100@gmail.com' ? 'المدير العام' : (user.displayName || 'موظف'),
            roleId: user.email === 'mohameadalhaear100@gmail.com' ? 'super_admin' : 'technician',
            isSuperAdmin: user.email === 'mohameadalhaear100@gmail.com',
            status: 'active'
        };

        document.getElementById('user-name-display').textContent = currentProfile.name;
        document.getElementById('user-role-display').textContent = currentProfile.isSuperAdmin ? 'Super Admin' : 'فني صيانة';

        elLogin.classList.add('hide');
        elApp.classList.remove('hide');

        // Render immediately with local/empty state
        renderPage(window.location.hash || '#dashboard');

        // Connect real-time listeners
        ['assets', 'workOrders', 'breakdowns', 'users', 'roles', 'spareParts', 'settings', 'auditLogs'].forEach(path => {
            onValue(ref(db, path), (snap) => {
                dbData[path] = snap.val() || {};
                renderPage(window.location.hash || '#dashboard');
            }, (err) => {
                console.warn("Database listener warning on " + path, err);
            });
        });

    } else {
        currentUser = null;
        currentProfile = null;
        elLogin.classList.remove('hide');
        elApp.classList.add('hide');
    }
});
